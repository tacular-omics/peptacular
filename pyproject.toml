[project]
name = "peptacular"
dynamic = ["version"]
description = "Parse, annotate, and analyze ProForma 2.1 peptide and protein sequences."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tacular>=1.1.0"]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/peptacular"
Documentation = "https://peptacular.readthedocs.io/"
Repository = "https://github.com/tacular-omics/peptacular"
Issues = "https://github.com/tacular-omics/peptacular/issues"
Changelog = "https://github.com/tacular-omics/peptacular/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.15054278"

[project.optional-dependencies]
mcp = ["mcp>=2.1.1,<2.2", "pydantic>=2.13,<3"]
pyteomics = ["pyteomics>=5.0"]
psm-utils = ["psm-utils>=1.0"]
alphabase = ["alphabase>=1.9"]
interop = [
    "pyteomics>=5.0",
    "psm-utils>=1.0",
    "alphabase>=1.9",
]

[project.scripts]
peptacular-mcp = "peptacular.mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peptacular"]

[tool.hatch.version]
path = "src/peptacular/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0",
    "pytest>=9.0.1",
    "jsonschema>=4.0",
    "pytest-cov>=6.0.0",
    "pympler>=1.1",
    "pyteomics>=5.0",
    "ruff>=0.14.7",
    "pyupgrade>=3.21.0",
    "ty>=0.0.11",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser",
    "pandas>=3.0.0",
    "pytest-xdist>=3.8.0",
    "lxml>=6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F401"]
"data.py" = ["E741"]
"constants.py" = ["E741"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
