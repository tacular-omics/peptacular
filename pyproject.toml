[project]
name = "peptacular"
dynamic = ["version"]
description = "Parse, annotate, and analyze ProForma 2.1 peptide and protein sequences."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tacular>=2.0,<3"]
authors = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" },
    { name = "John R. Yates III", email = "jyates@scripps.edu" },
]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
    { name = "Patrick T. Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/peptacular"
Documentation = "https://peptacular.readthedocs.io/"
Repository = "https://github.com/tacular-omics/peptacular"
Issues = "https://github.com/tacular-omics/peptacular/issues"
Changelog = "https://github.com/tacular-omics/peptacular/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.15054278"

[project.optional-dependencies]
# Every floor below is the lowest release that passes the tests exercising it on Python
# 3.12, measured version by version rather than inherited. Caps are a major cap per the
# workspace sibling-pin policy.
# mcp 2.0.0 is the first release with `mcp.server.MCPServer`. 1.30.0 raises ImportError on
# import. The pydantic floor is mcp's and not ours: mcp itself requires pydantic>=2.12.0.
mcp = ["mcp>=2.0.0,<3", "pydantic>=2.12,<3"]
# 5.0.1 rather than 5.0: pyteomics declares no unconditional dependencies at any version,
# and 5.0 declares exactly the same dependencies as 5.0.1, so 5.0 reaches the interop path
# only when lxml and numpy happen to be installed already -- which a bare
# peptacular[pyteomics] does not provide. The capability floor is higher than caution alone
# would suggest: 4.7.5 and below cannot parse ProForma charge adducts such as
# PEPTIDE/[H:z+1,Na:z+1].
pyteomics = ["pyteomics>=5.0.1"]
# Our surface here is two API points, Peptidoform(proforma_str) and .proforma, and it works
# back to 0.2.3 -- but on 4 tests. 0.9 is the last pre-1.0 line and the oldest range we
# would actually fix if it broke, which is the floor worth declaring.
psm-utils = ["psm-utils>=0.9"]
# alphabase 1.0.2 and below leave Acetyl@Any_N-term and Amidated@Any_C-term unregistered in
# the modification table, so terminal modifications cannot round-trip and to_alphabase_row
# raises InteropConversionError. 1.0.3 is the first release that passes, and it passes
# against pandas==2.1.2 as well as against pandas latest. Measured with RUN_SLOW=1:
# tests/test_interop_alphabase.py is pytest.mark.slow, and without it 37 of 39 tests skip
# and every version looks fine.
# pandas is declared here because the alphabase converters import it at run time, not only
# for typing: interop/alphabase.py:253 and :281 call require_dependency("pandas",
# "alphabase"). 2.1.1 is the first pandas with a cp312 wheel but installs broken on 3.12:
# it requires numpy>=1.26.0 with no upper bound, so a fresh resolve pairs numpy 2.x with a
# wheel built against the numpy 1.x C ABI and importing it raises "numpy.dtype size
# changed". 2.1.2 added numpy<2 and passes. That cap sits inside our own numpy>=1.26, so
# nothing conflicts. 2.2.2 is the first release that supports the numpy 2 ABI and drops it.
alphabase = ["alphabase>=1.0.3", "pandas>=2.1.2"]
# numpy 1.26.0 is the first release with cp312 wheels, and 1.25.2's sdist fails to build on
# 3.12 (distutils was removed). Minimal and forced by CPython, not chosen by us.
numpy = ["numpy>=1.26"]
interop = [
    "pyteomics>=5.0.1",
    "psm-utils>=0.9",
    "alphabase>=1.0.3",
    "pandas>=2.1.2",
]

[project.scripts]
peptacular-mcp = "peptacular.mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Source, tests and paperwork only: no paper, docs, lockfile or repo tooling.
only-include = [
    "src/peptacular",
    "tests",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peptacular"]

[tool.hatch.version]
path = "src/peptacular/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0",
    "pytest>=9.0.1",
    "jsonschema>=4.0",
    "pytest-cov>=6.0.0",
    "pympler>=1.1",
    "pyteomics>=5.0",
    "ruff>=0.16.8",
    "pyupgrade>=3.21.0",
    "ty>=0.0.83",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser",
    # Matches the alphabase extra's floor. A dev-group pin above a runtime floor shadows it,
    # because lowest-direct resolution takes the highest of two direct requirements, and the
    # floor then never gets tested.
    "pandas>=2.1.2",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pytest-xdist>=3.8.0",
    "lxml>=6.0.2",
    "hypothesis>=6.100",
    "fastatacular>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "slow: slower than ~2 s (subprocess launches, heavy optional imports); skipped unless --run-slow or RUN_SLOW=1",
]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F401"]
"data.py" = ["E741"]
"constants.py" = ["E741"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
