# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'PROFORMA_COMPLIANCE.md'
      - 'COMPLICANCE_NOTES.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'justfile'
      - '.github/workflows/python-package.yml'
      - '.github/workflows/python-publish.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'PROFORMA_COMPLIANCE.md'
      - 'COMPLICANCE_NOTES.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'justfile'
      - '.github/workflows/python-package.yml'
      - '.github/workflows/python-publish.yml'
  workflow_dispatch:

jobs:
  wheel-extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [pyteomics, psm-utils, alphabase]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v4
    - name: Build package
      run: uv build
    - name: Test an independently installed extra
      run: python scripts/test_wheel.py --extra ${{ matrix.extra }}

  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install just
      uses: extractions/setup-just@v2
    - name: Install dependencies
      run: uv sync --all-extras --frozen
    - name: Lint with ruff
      run: just lint
    - name: Type check with ty
      run: just ty
    - name: Test with pytest
      run: just test-cov
    - name: Build documentation and test examples
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        just docs
        just docs-test
        just examples
    - name: Build package
      run: uv build
    - name: Smoke test installed wheel
      run: uv run python scripts/test_wheel.py
    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/peptacular
        fail_ci_if_error: false
    - name: Upload test results to Codecov
      if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/peptacular
        report_type: test_results
        fail_ci_if_error: false
