# Standard tacular-omics release. Canonical copy: tacular-omics workspace templates/.
# Runs when a GitHub release is published. Publishes with PyPI trusted publishing:
# the PyPI project must list this repo, workflow "publish.yml", environment "pypi".
name: Publish

on:
  release:
    types: [published]

# Full test coverage: tests marked slow (MCP subprocess launches, AlphaBase interop) are
# skipped locally by default; CI runs them and uses the larger Hypothesis profile.
env:
  RUN_SLOW: "1"
  HYPOTHESIS_PROFILE: ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Release tag, version and changelog agree
        run: python scripts/release_version.py check --tag "${{ github.event.release.tag_name }}"
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ty check src
      - run: uv run pytest tests
      - run: uv build
      - run: python scripts/release_version.py check --tag "${{ github.event.release.tag_name }}" --dist dist
      - name: Smoke test installed wheel
        run: uv run python scripts/test_wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
