# Standard tacular-omics release. Canonical copy: tacular-omics workspace templates/.
# Runs when a GitHub release is published. Publishes with PyPI trusted publishing:
# the PyPI project must list this repo, workflow "publish.yml", environment "pypi".
name: Publish

on:
  release:
    types: [published]

# Full test coverage: tests marked slow (MCP subprocess launches, AlphaBase interop) are
# skipped locally by default; CI runs them and uses the larger Hypothesis profile.
env:
  RUN_SLOW: "1"
  HYPOTHESIS_PROFILE: ci

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Release tag, version and changelog agree
        run: python scripts/release_version.py check --tag "${{ github.event.release.tag_name }}"
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ty check src
      - run: uv run pytest tests
      - run: uv build
      - run: python scripts/release_version.py check --tag "${{ github.event.release.tag_name }}" --dist dist
      - name: Smoke test installed wheel
        run: uv run python scripts/test_wheel.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
