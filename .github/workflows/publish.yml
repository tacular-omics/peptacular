# Standard tacular-omics release. Canonical copy: tacular-omics workspace templates/.
# Runs when a GitHub release is published. Publishes with PyPI trusted publishing:
# the PyPI project must list this repo, workflow "publish.yml", environment "pypi".
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Release tag, version and changelog agree
        run: python scripts/release_version.py check --tag "${{ github.event.release.tag_name }}"
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests
      - run: uv run ty check src
      - run: uv run pytest tests
      - run: uv build
      - run: python scripts/release_version.py check --tag "${{ github.event.release.tag_name }}" --dist dist
      - name: Smoke test installed wheel
        run: uv run python scripts/test_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
